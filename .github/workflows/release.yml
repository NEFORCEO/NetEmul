name: Build and release NetEmul

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: netemul-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      should_release: ${{ steps.read.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: read
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < version.txt)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "version.txt must contain a version like 0.9.7 (without a v prefix)" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git tag --list "v$version" | grep -q .; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "Release v$version already exists; skipping both builds."
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "New release v$version will be built."
          fi

  build-macos:
    needs: version
    if: needs.version.outputs.should_release == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Verify Apple Silicon runner
        run: test "$(uname -m)" = arm64
      - uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          host: mac
          target: desktop
          arch: clang_64
          modules: qtscript
          archives: qtbase qtmultimedia qtsvg qttools
          cache: true
      - name: Build and package macOS app
        working-directory: netemul-1.0
        run: |
          rm -rf build
          qmake netemul.pro CONFIG+=release
          make -j"$(sysctl -n hw.ncpu)"
          macdeployqt netemul.app -dmg
          test -f netemul.dmg
          mv netemul.dmg "../NetEmul-${{ needs.version.outputs.version }}-macOS.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: NetEmul-${{ needs.version.outputs.version }}-macOS.dmg
          if-no-files-found: error

  build-windows:
    needs: version
    if: needs.version.outputs.should_release == 'true'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          host: windows
          target: desktop
          arch: win64_mingw81
          modules: qtscript
          archives: qtbase qtmultimedia qtsvg qttools
          tools: 'tools_mingw,qt.tools.win64_mingw810'
          cache: true
      - name: Build and package Windows app
        shell: pwsh
        working-directory: netemul-1.0
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path 'build') { Remove-Item -Recurse -Force 'build' }
          qmake netemul.pro 'CONFIG+=release'
          mingw32-make -j $env:NUMBER_OF_PROCESSORS
          if (!(Test-Path 'release/netemul.exe')) {
            throw 'Expected release/netemul.exe was not produced.'
          }
          $windeployqt = Join-Path $env:QT_ROOT_DIR 'bin/windeployqt.exe'
          if (!(Test-Path $windeployqt)) {
            throw "windeployqt is missing from the Qt installation: $windeployqt"
          }
          & $windeployqt --compiler-runtime --multimedia --verbose 2 --dir release --plugindir release 'release/netemul.exe'
          if ($LASTEXITCODE -ne 0) {
            throw "windeployqt failed with exit code $LASTEXITCODE."
          }

          $qtRuntimeDlls = @(
            'Qt5Core.dll', 'Qt5Gui.dll', 'Qt5Widgets.dll', 'Qt5Network.dll',
            'Qt5Multimedia.dll', 'Qt5OpenGL.dll', 'Qt5PrintSupport.dll',
            'Qt5Script.dll', 'Qt5Svg.dll'
          )
          foreach ($dll in $qtRuntimeDlls) {
            $sourceDll = Join-Path $env:QT_ROOT_DIR "bin/$dll"
            if (!(Test-Path $sourceDll)) {
              throw "Qt runtime DLL is missing from the SDK: $sourceDll"
            }
            Copy-Item $sourceDll 'release/' -Force
          }

          $mingwBin = Join-Path $env:IQTA_TOOLS 'mingw810_64/bin'
          foreach ($dll in @('libgcc_s_seh-1.dll', 'libstdc++-6.dll', 'libwinpthread-1.dll')) {
            $sourceDll = Join-Path $mingwBin $dll
            if (!(Test-Path $sourceDll)) {
              throw "MinGW runtime DLL is missing: $sourceDll"
            }
            Copy-Item $sourceDll 'release/' -Force
          }

          $platformPlugin = Join-Path $env:QT_ROOT_DIR 'plugins/platforms/qwindows.dll'
          if (!(Test-Path $platformPlugin)) {
            throw "Qt Windows platform plugin is missing: $platformPlugin"
          }
          New-Item -ItemType Directory -Force -Path 'release/platforms' | Out-Null
          Copy-Item $platformPlugin 'release/platforms/qwindows.dll' -Force

          $requiredFiles = @(
            'Qt5Core.dll', 'Qt5Gui.dll', 'Qt5Widgets.dll', 'Qt5Network.dll',
            'Qt5Multimedia.dll', 'Qt5OpenGL.dll', 'Qt5PrintSupport.dll',
            'Qt5Script.dll', 'Qt5Svg.dll', 'platforms/qwindows.dll',
            'libgcc_s_seh-1.dll', 'libstdc++-6.dll', 'libwinpthread-1.dll'
          )
          foreach ($file in $requiredFiles) {
            if (!(Test-Path (Join-Path 'release' $file))) {
              throw "Qt deployment is incomplete: release/$file is missing."
            }
          }

          $appProcess = Start-Process -FilePath (Resolve-Path 'release/netemul.exe') -WorkingDirectory (Resolve-Path 'release') -PassThru
          Start-Sleep -Seconds 8
          if ($appProcess.HasExited) {
            throw "NetEmul failed to start (exit code $($appProcess.ExitCode))."
          }
          Stop-Process -Id $appProcess.Id -Force

          Copy-Item -Recurse translation release/translation
          Copy-Item -Recurse scripts release/scripts
          Copy-Item -Recurse doc release/doc
          $releaseDir = (Resolve-Path 'release').Path
          & iscc.exe /Q "/DAppVersion=${{ needs.version.outputs.version }}" "/DReleaseDir=$releaseDir" windows\netemul.iss
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed with exit code $LASTEXITCODE."
          }
          if (!(Test-Path 'windows/NetEmul-Setup.exe')) {
            throw 'Expected windows/NetEmul-Setup.exe installer was not produced.'
          }
          Move-Item windows/NetEmul-Setup.exe "../NetEmul-${{ needs.version.outputs.version }}-Windows.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: NetEmul-${{ needs.version.outputs.version }}-Windows.exe
          if-no-files-found: error

  release:
    needs: [version, build-macos, build-windows]
    if: needs.version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Create tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "v$VERSION" -m "NetEmul $VERSION"
          git push origin "v$VERSION"
          gh release create "v$VERSION" release-assets/* \
            --title "NetEmul $VERSION" \
            --generate-notes
